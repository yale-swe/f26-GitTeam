# Render blueprint for the DevSync backend. Importing this file from the
# Render dashboard (Blueprints → New) creates the service with the right
# Dockerfile, health check and env-var slots. The frontend is deployed
# separately on Vercel; Postgres and Auth live on Supabase.
#
# Secrets (DATABASE_URL, OPENROUTER_API_KEY, GitHub/Discord tokens, etc.) are
# declared with `sync: false` so Render prompts for them once in the dashboard
# instead of reading them from this file. Never commit real values here.
services:
  - type: web
    name: devsync-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Required ---
      - key: DATABASE_URL
        sync: false  # Supabase Session pooler URI, prefixed postgresql+psycopg://
      - key: CORS_ORIGINS
        sync: false  # JSON list, e.g. ["https://devsync.vercel.app"]
      - key: SUPABASE_URL
        sync: false  # https://<project-ref>.supabase.co

      # --- LLM summaries ---
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false

      # --- Discord integration ---
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false

      # --- GitHub integration (see docs/github-app.md) ---
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false  # .pem on one line with \n escapes
      - key: GITHUB_APP_SLUG
        sync: false

      # --- Optional / legacy ---
      - key: SUPABASE_JWT_SECRET
        sync: false  # Only for legacy HS256 projects; otherwise leave unset.
      - key: SUMMARY_MIN_INTERVAL_SECONDS
        value: "60"
      - key: DISCORD_DEBUG_MESSAGES_ENABLED
        value: "false"
